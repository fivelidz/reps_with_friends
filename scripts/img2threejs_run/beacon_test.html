<!doctype html>
<!-- img2threejs run · stage-4 gate page. Loads the generated module exactly
     like the /avatars photo strip card (same lights/framing contract) and
     reports status into the DOM for headless extraction. -->
<html>
<head>
<meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "/site/lib/three.module.js" } }
</script>
<style>
  html, body { margin: 0; width: 480px; height: 600px; background: #0e0f13; overflow: hidden; }
  #stage { width: 480px; height: 600px; }
  #status { position: fixed; left: 4px; top: 4px; color: #c6f32e; font: 12px monospace; z-index: 9; }
</style>
</head>
<body>
<div id="status">BOOT</div>
<div id="stage"></div>
<script type="module">
const statusEl = document.getElementById('status');
const errors = [];
window.addEventListener('error', (e) => { errors.push(String(e.message)); statusEl.textContent = 'ERR:' + errors.join('|'); });
try {
  const THREE = await import('three');
  const { createBeaconModel } = await import('/site/models/photo_avatars/generated/beacon.js');

  const W = 480, H = 600;
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(38, W / H, 0.01, 60);
  // same rig as apps/avatars photo cards
  const key = new THREE.DirectionalLight(0xffffff, 3.2); key.position.set(1.5, 3, 2); scene.add(key);
  const key2 = new THREE.DirectionalLight(0xfff2e0, 1.6); key2.position.set(-1.2, 2, 2.4); scene.add(key2);
  const warm = new THREE.PointLight(0xffd9a0, 2.4, 8); warm.position.set(1.8, 0.9, 1.8); scene.add(warm);
  const fill = new THREE.HemisphereLight(0x8fb6ff, 0x1a1d23, 1.8); scene.add(fill);
  const rim = new THREE.PointLight(0xc6f32e, 3, 8); rim.position.set(-2, 1.4, -2); scene.add(rim);

  const model = createBeaconModel();
  if (typeof model.userData.tick !== 'function') throw new Error('no userData.tick');
  if (!model.userData.sockets || !model.userData.sockets.head) throw new Error('no sockets.head');

  const box0 = new THREE.Box3().setFromObject(model);
  const c0 = box0.getCenter(new THREE.Vector3());
  model.position.sub(new THREE.Vector3(c0.x, box0.min.y, c0.z));
  const s0 = 1.5 / Math.max(0.01, box0.max.y - box0.min.y);
  model.scale.setScalar(s0);
  const turn = new THREE.Group(); turn.add(model); scene.add(turn);
  turn.rotation.y = 0.15; // near-frontal: honest comparison view (rings both visible)
  const box = new THREE.Box3().setFromObject(model);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const radius = Math.max(sphere.radius, 0.55);
  const vFov = THREE.MathUtils.degToRad(cam.fov);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * (W / H));
  const dist = (radius * 1.12) / Math.sin(Math.min(vFov, hFov) / 2);
  cam.position.set(sphere.center.x + dist * 0.16, sphere.center.y + radius * 0.18, dist);
  cam.lookAt(sphere.center);

  const r = new THREE.WebGLRenderer({ antialias: true });
  r.setPixelRatio(1);
  r.setSize(W, H);
  r.outputColorSpace = THREE.SRGBColorSpace;
  document.getElementById('stage').appendChild(r.domElement);
  model.userData.tick(0.6); // one idle frame
  r.render(scene, cam);
  statusEl.textContent = 'OK meshes=' + model.children.length + ' tick+sockets OK errors=' + errors.length;
} catch (e) {
  statusEl.textContent = 'ERR:' + e.message;
}
</script>
</body>
</html>
