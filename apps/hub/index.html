<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RWF Hub — Ops Console</title>
  <link rel="stylesheet" href="/design/tokens.css">
  <link rel="stylesheet" href="/design/fonts/fonts.css">
  <link rel="stylesheet" href="/hub/hub.css">
  <script type="module" src="/hub/hub.js"></script>
</head>
<body>

  <!-- ── Top bar ─────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="wordmark">
      <span class="wordmark-rwf">RWF</span>
      <span class="wordmark-sub">HUB · OPS CONSOLE</span>
    </div>

    <div class="sysdots" id="sysdots">
      <span class="sysdot" id="dot-server">
        <i class="rwf-dot rwf-dot--idle"></i><span class="sysdot-label">Server</span>
      </span>
      <span class="sysdot" id="dot-hub">
        <i class="rwf-dot rwf-dot--idle"></i><span class="sysdot-label">Qalarc Hub</span>
      </span>
      <span class="sysdot" id="dot-whatsapp">
        <i class="rwf-dot rwf-dot--idle"></i><span class="sysdot-label">WhatsApp</span>
      </span>
      <span class="sysdot" id="dot-slack">
        <i class="rwf-dot rwf-dot--idle"></i><span class="sysdot-label">Slack</span>
      </span>
    </div>

    <div class="topbar-right">
      <span class="sync mono" id="sync">connecting…</span>
      <span class="uptime mono" id="uptime" title="Server uptime">up —</span>
    </div>
  </header>

  <!-- ── Console ─────────────────────────────────────────────── -->
  <main class="console">

    <section class="stats" id="stats" aria-label="System stats"></section>

    <div class="cols">

      <section class="panel matches-panel" aria-label="Matches">
        <div class="panel-head">
          <h2>Matches</h2>
          <span class="panel-sub mono" id="matches-sub">—</span>
        </div>
        <div class="matches-scroll">
          <div class="mtable" id="matches" role="grid"></div>
        </div>
      </section>

      <aside class="panel feed-panel" aria-label="Activity feed">
        <div class="panel-head">
          <h2>Activity</h2>
          <span class="panel-sub">poll diff · 3s</span>
        </div>
        <div class="feed-scroll">
          <div class="feed" id="feed"></div>
        </div>
      </aside>

    </div>
  </main>

</body>
</html>
