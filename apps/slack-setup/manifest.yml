display_information:
  name: Reps With Friends
  description: Real-time multiplayer fitness inside your group chats. Effort wins the day.
  background_color: "#0a0b0d"
features:
  bot_user:
    display_name: RWF
    always_online: true
  slash_commands:
    - command: /rwf
      description: Reps With Friends match commands
      usage_hint: "new | join [tier] | start | log <exercise> <reps> | s | taunt <name> | pot <cents> | result | season ladder"
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - app_mentions:read
settings:
  socket_mode: true
  org_deploy_enabled: false
  token_rotation_enabled: false
