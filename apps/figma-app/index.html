<!doctype html>
<!-- RWF × FIGMA TEST APP — every Ben screen, real engine.
     v1.0.0 · static + vendored: works offline after first load (sw.js).
     Theme: LIME default; Settings → Theme (beta) offers all five
     (design/themes.css — lime/gold/sunset/neon/forest, persisted).
     ?demo=1 deep-links the self-playing app demo (demo.js). -->
<html lang="en" data-theme="lime">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reps With Friends — v1.0.0</title>
  <meta name="description" content="Reps With Friends prototype — the real game engine behind Ben's design: battles, handicaps, power-ups, daily winners. Works offline.">
  <meta name="theme-color" content="#0b0a12">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="themes.css"><!-- five-theme exploration (beta) -->
  <link rel="stylesheet" href="figma-components.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="squads.css"><!-- multi-squad dashboard (SQD wave) -->
  <link rel="stylesheet" href="daily.css"><!-- temporal loop (FLOW-06/07) -->
  <link rel="stylesheet" href="app-demo.css"><!-- demo mode narrator (v1.0.0) -->
  <script>
    // Register the SW before anything heavy; ignore failures (file:// etc).
    // Module worker: sw.js imports version.js (the build stamp) so its
    // cache name changes on every deploy — no more stale caches.
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js", { type: "module" }).catch(() => {}));
    }
  </script>
</head>
<body>
  <div id="app" class="fx-app"></div>
  <script type="module" src="sfx.js"></script><!-- local audio generator: WebAudio SFX on every button (window.rwfSfx) -->
  <script type="module" src="app.js"></script>
</body>
</html>
