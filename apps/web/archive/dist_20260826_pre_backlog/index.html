<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="description" content="Reps With Friends — the group chat gets fit. Winner picks the charity.">
  <title>Reps With Friends</title>
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" href="/app/icon.svg" type="image/svg+xml">
  <!-- Space Grotesk from the shared design system (served at /design).
       Absolute URL: dist is served under /app. Kept out of the CSS bundle
       because bun's bundler resolves absolute url()s at build time. -->
  <style>
    @font-face {
      font-family: "Space Grotesk";
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
      src: url("/design/fonts/sg-var.woff2") format("woff2");
    }
  </style>
  <link rel="stylesheet" href="/app/main.css">
  <script defer src="/app/main.js"></script>
</head>
<body>
  <div id="frame">
    <main id="app"></main>
    <nav id="nav" aria-label="App navigation"></nav>
    <div id="toasts" aria-live="polite"></div>
  </div>
</body>
</html>
