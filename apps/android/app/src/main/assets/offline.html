<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reps With Friends — Offline</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0b0d; color: #e8ecdf;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 20px; padding: 32px; text-align: center; }
  .glyph { color: #c6f32e; }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: .02em; }
  p { color: #9aa3ad; margin: 0; max-width: 30ch; line-height: 1.5; }
  button { margin-top: 8px; background: #c6f32e; color: #0a0b0d; border: 0;
    border-radius: 999px; padding: 14px 34px; font-size: 1rem; font-weight: 700;
    letter-spacing: .02em; }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
<div class="wrap">
  <svg class="glyph" viewBox="0 0 24 24" width="72" height="72" aria-hidden="true" fill="currentColor">
    <rect x="1" y="10.7" width="3.2" height="2.6" rx="1.1"/>
    <rect x="4.6" y="8.2" width="3.4" height="7.6" rx="1.2"/>
    <rect x="8.6" y="11" width="6.8" height="2" rx="1"/>
    <rect x="16" y="8.2" width="3.4" height="7.6" rx="1.2"/>
    <rect x="19.8" y="10.7" width="3.2" height="2.6" rx="1.1"/>
  </svg>
  <h1>You're offline</h1>
  <p>Reps With Friends needs the internet to load. Check your connection and try again.</p>
  <button onclick="retry()">Try again</button>
</div>
<script>
  function retry() {
    if (window.Android && window.Android.retry) {
      window.Android.retry(); // native bridge reloads the app URL
    } else {
      location.reload(); // plain-browser fallback
    }
  }
</script>
</body>
</html>
