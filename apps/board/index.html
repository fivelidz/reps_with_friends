<!doctype html>
<!-- ═══════════════════════════════════════════════════════════════════
     RWF · V2 — THE TABLE
     The track-and-field BOARD GAME battle.
       · power-ups = CARDS (fanned hand, deal/play/expiry animation)
       · the TRACK around the table edge = progress (raw/target)
       · the POT in the middle = shared points (chip stacks by denomination)
       · board-game feel: felt, chunky POPPING buttons (offset shadows)
     Independent fork of the v1 engine (see fork banners in engine.js /
     daily.js / state.js). Saves to rwf.board.v2 — v1 (/figma-app) is
     untouched. Theme: board (design/themes.css); every skin switchable
     on the home screen. No deps, no libs, no build step.
     ═══════════════════════════════════════════════════════════════════ -->
<html lang="en" data-theme="board">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reps With Friends — V2 · The Table</title>
  <meta name="description" content="Reps With Friends V2 — the track-and-field board game battle. Cards, lanes, and the pot in the middle.">
  <meta name="theme-color" content="#0d1f16">
  <!-- inline favicon (gold chip on felt) — no extra request, no 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c1d14'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23ffc94d' stroke='%23241a04' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='none' stroke='%23241a04' stroke-width='2' stroke-dasharray='3 2.4'/%3E%3C/svg%3E">
  <!-- theme: apply the saved skin pre-paint so there is no flash -->
  <script>
    try {
      const t = localStorage.getItem("rwf.board.theme");
      if (t && /^[a-z0-9]+$/.test(t)) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
  <link rel="stylesheet" href="/design/fonts/fonts.css">
  <link rel="stylesheet" href="/design/tokens.css">
  <link rel="stylesheet" href="/design/themes.css">
  <link rel="stylesheet" href="board.css">
</head>
<body>
  <div id="app" class="bd-app" aria-live="polite"></div>
  <script type="module" src="board.js"></script>
</body>
</html>
